worker_processes 1;
pid /home/spartanec/.local/state/hub/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_max_body_size 22m;
    client_body_timeout 60s;
    proxy_temp_path /home/spartanec/.local/state/hub/nginx/proxy_temp;
    client_body_temp_path /home/spartanec/.local/state/hub/nginx/client_body_temp;
    access_log off;

    server {
        listen 127.0.0.1:8080;
        server_name _;
        root /home/spartanec/hub/pwa/dist;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # cloudflared is the only public ingress; use its edge-asserted
            # client address rather than a user-supplied X-Forwarded-For chain.
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location = /sw.js {
            try_files $uri =404;
            add_header Service-Worker-Allowed "/" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /icons/ {
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
