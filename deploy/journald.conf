# /etc/systemd/journald.conf.d/zbot.conf
# Падать при OOM молча нельзя: если OOM-killer всё же сработает,
# причина падения должна пережить следующий рестарт и быть видна в journalctl.
# 200 МБ на /var/log/journal на VPS с 512 МБ RAM — с запасом от полной
# перезаписи журнала при активном логировании.
[Journal]
SystemMaxUse=200M