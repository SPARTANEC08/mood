# Mood SE — аварийная заглушка.
# Старое приложение с сервером в Швеции больше не должно работать:
# API закрыт, все страницы ведут на статью о переезде.
# Сертификат: /etc/letsencrypt/live/109-120-129-61.sslip.io

server {
    listen 80;
    listen [::]:80;
    server_name 109-120-129-61.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 109-120-129-61.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/109-120-129-61.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/109-120-129-61.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mood-pwa;
    index index.html;

    include snippets/mood-security-headers.conf;

    # Никакого API: старая база и БАРС/OWA недоступны.
    location /api/ {
        return 410;
    }

    location /dev-api/ {
        return 410;
    }

    location = /health {
        return 410;
    }

    # Kill-switch: обновляется старым service worker и уводит вкладки на РФ.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        include snippets/mood-security-headers.conf;
        try_files /sw.js =404;
    }

    # Страница переезда. Clear-Site-Data убирает старый PWA-токен и кэши.
    location = /index.html {
        add_header Clear-Site-Data '"cache", "storage"' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include snippets/mood-security-headers.conf;
        try_files /index.html =404;
    }

    location / {
        add_header Clear-Site-Data '"cache", "storage"' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }
}
