# /etc/ssh/sshd_config.d/00-mood-hardening.conf
#
# Жёсткая политика SSH. Имя начинается с 00- намеренно: OpenSSH берёт ПЕРВОЕ
# встреченное значение параметра, а файлы в sshd_config.d читаются по алфавиту.
# Провайдерские дроп-ины вида 00password.conf с PermitRootLogin yes не должны
# выигрывать.
#
# Установка:
#   sudo cp backend/deploy/sshd-mood-hardening.conf \
#       /etc/ssh/sshd_config.d/00-mood-hardening.conf
#   sudo sshd -t && sudo sshd -T | grep -Ei 'permitroot|passwordauth|allowusers'
#   sudo systemctl reload ssh
#
# ВАЖНО: перед применением убедитесь, что вход по ключу работает —
# пароль и root после reload будут закрыты.

PubkeyAuthentication yes
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 20
AllowUsers spartanec
