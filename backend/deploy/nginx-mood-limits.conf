# Грубая защита edge от флуда по auth-эндпоинтам.
#
# Подключается на уровне http (Debian: /etc/nginx/conf.d/mood-limits.conf).
# Приложение считает попытки входа само (5/15 мин на IP и на логин), это —
# дополнительный слой, чтобы флуд не доходил до Node и БАРС вовсе.
#
# 30 запросов в минуту с одного IP: легитимному человеку с запасом (форма
# входа отправляется по нажатию), скрипту — мало.
limit_req_zone $binary_remote_addr zone=mood_auth:10m rate=30r/m;
limit_req_status 429;
