# Общие параметры проксирования API для nginx.
#
# Подключается и в общий location /api/, и в точечные auth-локации:
#   include snippets/mood-api-proxy.conf;
#
# API слушает только 127.0.0.1:3000 (Fastify), наружу отдаёт nginx.
# proxy_read_timeout 120s — потому что /api/mail и /api/bars/* ходят в МЭИ
# и штатно могут отвечать дольше стандартных 60 секунд.

proxy_pass http://mood_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# Ошибки API не подменяем офлайн-заглушкой: клиент различает
# 503 «сервер недоступен» и 404 «маршрута нет».
proxy_intercept_errors off;
