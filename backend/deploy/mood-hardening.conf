# /etc/systemd/system/mood.service.d/hardening.conf
#
# Дополнительная изоляция процесса приложения (drop-in к mood.service).
# Ставится на VPS с 830 МБ RAM: лимиты памяти подобраны под неё.
#
# Установка:
#   sudo install -d /etc/systemd/system/mood.service.d
#   sudo cp backend/deploy/mood-hardening.conf \
#       /etc/systemd/system/mood.service.d/hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart mood
#
# ReadWritePaths — единственный каталог, куда приложению можно писать:
# SQLite, файлы пользователей, отчёты и превью. Всё остальное — только чтение.

[Service]
# Потолок кучи под физические 830 МБ. Прежние 768/1536M были выше RAM:
# при OOM срабатывал бы системный killer, а не понятная ошибка V8.
ExecStart=
ExecStart=/usr/bin/node --max-old-space-size=512 dist/app.js
MemoryMax=700M

NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/spartanec/mood/db/data
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
