# Боевой server-блок Mood (прямой nginx + Let's Encrypt).
#
# Установка:
#   sudo cp backend/deploy/nginx-mood-app.conf /etc/nginx/sites-available/mood
#   sudo ln -sf /etc/nginx/sites-available/mood /etc/nginx/sites-enabled/mood
#   sudo cp backend/deploy/nginx-mood-api-proxy.conf  /etc/nginx/snippets/mood-api-proxy.conf
#   sudo cp backend/deploy/nginx-mood-limits.conf     /etc/nginx/conf.d/mood-limits.conf
#   sudo cp backend/deploy/nginx-security-headers.conf /etc/nginx/snippets/mood-security-headers.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените pwa.example.com и пути к сертификату на свои.
# HTTP-блок оставлен для ACME: сертификат продлевается именно по HTTP-01.

upstream mood_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pwa.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25+: отдельная директива, параметр у listen устарел.
    http2 on;

    server_name pwa.example.com;

    ssl_certificate     /etc/letsencrypt/live/pwa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pwa.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mood-pwa;
    index index.html;
    client_max_body_size 22m;

    # ── Безопасность ─────────────────────────────────────────────────────────
    include snippets/mood-security-headers.conf;

    # Скрытые файлы и служебные расширения наружу не отдаём. Исключение —
    # .well-known (ACME и assetlinks.json).
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bak|old|orig|save|sqlite|sqlite3|sql|log|env|conf|ini|map)$ { deny all; }

    # ── Сжатие ───────────────────────────────────────────────────────────────
    # gzip_static: сборка кладёт рядом .gz (pwa/scripts/precompress.mjs), и
    # nginx отдаёт его без сжатия на лету. На 1 vCPU это снимает заметную
    # нагрузку при релизе, когда все клиенты тянут новые чанки.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml application/xml
               application/xml+rss text/xml;

    # ── Статика ──────────────────────────────────────────────────────────────
    # Хешированные имена из /assets/ меняются при сборке → год в кэше безопасен.
    location /assets/ {
        include snippets/mood-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /icons/ {
        include snippets/mood-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /manifest.webmanifest {
        include snippets/mood-security-headers.conf;
        open_file_cache off;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location = /sw.js {
        include snippets/mood-security-headers.conf;
        open_file_cache off;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    location = /index.html {
        include snippets/mood-security-headers.conf;
        open_file_cache off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        include snippets/mood-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        include snippets/mood-api-proxy.conf;
    }

    # Токен share-ссылки — секрет в пути. В access-лог он попадать не должен.
    location ^~ /api/files/share/ {
        access_log off;
        include snippets/mood-api-proxy.conf;
    }

    # Чувствительные точки входа: отдельный limit_req (см. mood-limits.conf).
    location = /api/auth/login {
        limit_req zone=mood_auth burst=10 nodelay;
        include snippets/mood-api-proxy.conf;
    }
    location = /api/auth/register {
        limit_req zone=mood_auth burst=10 nodelay;
        include snippets/mood-api-proxy.conf;
    }
    location = /api/auth/2fa {
        limit_req zone=mood_auth burst=10 nodelay;
        include snippets/mood-api-proxy.conf;
    }
    location = /api/auth/refresh {
        limit_req zone=mood_auth burst=10 nodelay;
        include snippets/mood-api-proxy.conf;
    }
    location = /api/guest/session {
        limit_req zone=mood_auth burst=10 nodelay;
        include snippets/mood-api-proxy.conf;
    }

    # Служебные страницы наружу не отдаются: на этом контуре они не нужны.
    location ^~ /dev/ { return 404; }
    location ^~ /dev-api/ { return 404; }
    # Тестовая страница и 1.5 МБ sample.pdf собираются из public/ для разработки,
    # в проде они только увеличивают поверхность.
    location ^~ /test/ { return 404; }

    # SPA-fallback: API вынесен выше, поэтому index.html безопасен.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
