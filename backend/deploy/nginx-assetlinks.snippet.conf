# Digital Asset Links для TWA (APK без адресной строки).
#
# Вставить ВНУТРЬ сервер-блока с HTTPS (там, где root /var/www/mood-pwa).
# Без этого файла или при неверном Content-Type приложение откроется с адресной
# строкой, как обычная вкладка — при этом внешне всё остальное будет работать,
# поэтому поломка тихая.
#
# Проверка после применения:
#   curl -sI https://<домен>/.well-known/assetlinks.json | grep -i content-type
#   # ожидаем: content-type: application/json
#
# Применить:
#   sudo nginx -t && sudo systemctl reload nginx

location = /.well-known/assetlinks.json {
    # default_type, а не types{}: файл отдаётся как JSON всегда, независимо от
    # /etc/nginx/mime.types конкретной системы.
    default_type application/json;
    # Отпечаток меняется только при перегенерации ключа, но кэшировать его нечем:
    # приложение проверяется при запуске, и устаревшая копия сломает верификацию.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
