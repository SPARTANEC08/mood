# Общие заголовки безопасности Mood (nginx-сниппет).
#
# Установка:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp backend/deploy/nginx-security-headers.conf /etc/nginx/snippets/mood-security-headers.conf
#
# Затем подключить:
#   include snippets/mood-security-headers.conf;
# в server{} HTTPS-блока И в каждый location{}, у которого есть свой add_header:
# nginx НЕ наследует add_header, если location объявляет собственный (это
# касается /assets/, /icons/, /manifest.webmanifest, /sw.js, /index.html,
# /install/, /api/, /dev-api/, /robots.txt и assetlinks.json).
#
# CSP здесь СОЗНАТЕЛЬНО не задаётся: приложение использует blob:-URL для
# просмотра файлов, а политику нужно вводить с ручной проверкой вьюера, иначе
# тихо ломается открытие PDF/фото. См. README, «Известные риски».

# HSTS — только в HTTPS-блоке (в :80 он бессмысленен).
add_header Strict-Transport-Security "max-age=31536000" always;
# Без nosniff браузер может угадать тип файла и исполнить его как скрипт.
add_header X-Content-Type-Options "nosniff" always;
# Для /dev/#<токен> и share-ссылок: фрагмент на сервер не уходит, но заголовок
# закрывает случайные утечки реферера на внешние ресурсы.
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# CSP: без inline-скриптов (recovery-скрипт вынесен в /boot-recovery.js).
# style unsafe-inline нужен из-за inline style= в React; blob: — фото/PDF.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob: https://109-120-129-61.sslip.io; frame-src 'self' blob: https://109-120-129-61.sslip.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
