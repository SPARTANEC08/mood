<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover обязателен и здесь: в standalone-режиме на iPhone
      контент иначе уезжает под вырез и домашнюю индикацию, потому что
      env(safe-area-inset-*) без него возвращает нули.

      maximum-scale и user-scalable=no запрещают масштабирование интерфейса
      щипком: приложение ведёт себя как нативное, случайный зум не «разъезжает»
      вёрстку. Просмотр файлов — исключение: там свой зум (жестами для картинки
      и кнопками для PDF), и блокировка на него не распространяется (см.
      lib/env.ts и data-mood-file-viewer во вьюере).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Mood — расписание, задания, оценки и почта НИУ МЭИ" />

    <!--
      Первый экран для тех, у кого ещё нет PWA-токена: корень уводит на
      статический лендинг. Скрипт стоит до манифеста и React, чтобы не
      показывать экран входа и сразу перейти на лендинг. Вход с лендинга
      идёт на /?login=1 — этот параметр отключает редирект.
    -->
    <script src="/landing-boot.js"></script>

    <!-- PWA-манифест: имя, иконки, standalone-режим. ?v — версия набора иконок:
         при смене иконок увеличить, чтобы браузер перечитал манифест и обновил
         иконки, не дожидаясь истечения месячного кэша. -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" />

    <!--
      iOS не читает манифест для иконки на экране «домой» и запуска с иконки —
      он берёт только эти мета-теги. Без них «На экран Домой» добавит белую
      иконку-заглушку, а приложение откроется с адресной строкой.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mood" />

    <!--
      Цвет статус-бара/адресной строки. Начальное значение — фон тёмной темы
      (она по умолчанию); theme-init.js ниже сразу поправит его, если выбрана
      светлая.
    -->
    <meta name="theme-color" content="#15131e" />
    <!-- color-scheme до CSS и JS: системные контролы совпадают с темой с самого
         первого кадра, без вспышки светлого. -->
    <meta name="color-scheme" content="light dark" />

    <!--
      Тема до первого кадра. Скрипт синхронный, стоит в <head> раньше стилей и
      бандла, поэтому data-theme уже выставлен к первой отрисовке — вспышки
      темы нет. Это отдельный файл, а не инлайн-скрипт: CSP продакшена разрешает
      только `script-src 'self'` и инлайн заблокировал бы. См. public/theme-init.js
      и src/lib/theme.ts.
    -->
    <script src="/theme-init.js?v=2"></script>

    <!--
      Критический фон и стартовый splash прямо в документе.

      Стили приложения приезжают вместе с бандлом (styles.css), а он — это
      отдельный запрос. До его применения <body> оставался белым: на медленной
      сети и при холодном старте пользователь видел белый экран. Здесь фон
      задан инлайново и повторяет --app-bg, поэтому первый кадр сразу в теме.

      Splash — тот же фон плюс лёгкий индикатор: он виден, только пока React не
      смонтировался, и снимается из App (см. pwa/src/App.tsx). Если скрипт вообще
      не загрузился, остаётся тематический фон, а не белизна.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: var(--app-bg, #f4f2fb);
        color-scheme: light dark;
      }
      #mood-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--app-bg, #f4f2fb);
      }
      #mood-splash::after {
        content: '';
        width: 26px;
        height: 26px;
        border-radius: 9999px;
        border: 3px solid var(--accent-soft, rgba(124, 77, 255, 0.25));
        border-top-color: var(--accent, #7c4dff);
        animation: mood-splash-spin 0.9s linear infinite;
      }
      /* Тёмная тема: фон и индикатор уже приходят из --app-bg/--accent.
         Правило оставлено только как запасной вариант, если ранний скрипт
         не выполнился или storage недоступен. */
      html[data-theme='dark'],
      html[data-theme='dark'] body,
      html[data-theme='dark'] #mood-splash {
        background: var(--app-bg, #15131e);
      }
      html[data-theme='dark'] #mood-splash::after {
        border-color: var(--accent-soft, rgba(157, 69, 254, 0.25));
        border-top-color: var(--accent, #9d45fe);
      }
      @keyframes mood-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #mood-splash::after {
          animation: none;
        }
      }
    </style>

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/site-icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
    <!-- ICO последним: браузер берёт первую подходящую иконку, поэтому он
         нужен только там, где PNG не принимают. -->
    <link rel="icon" href="/icons/favicon.ico?v=2" sizes="32x32" />

    <title>Mood — расписание МЭИ</title>
  </head>
  <body>
    <div id="mood-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <!--
      Аварийное самовосстановление.

      Если через 6 секунд React так и не смонтировался (#root пуст), значит
      клиент застрял на битом кэше Service Worker: старый index.html ссылается
      на уже удалённые чанки, а обновление воркера заблокировано троттлингом
      браузера. Тогда один раз за сессию чистим Cache Storage, снимаем
      регистрацию SW и перезагружаемся — приложение поднимется по сети.
      Повторно не срабатывает (sessionStorage), чтобы не было цикла перезагрузок.
    -->
    <script src="/boot-recovery.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
